name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the versions in the manifests
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          plugin_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml | head -n 1)
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$plugin_version" ]; then
            echo "Tag is $tag, Cargo.toml is $cargo_version, herdr-plugin.toml is $plugin_version" >&2
            exit 1
          fi
      - run: rustup update stable && rustup target add ${{ matrix.target }}
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          asset="herdr-alt-tab-${{ matrix.target }}.tar.gz"
          mkdir dist
          tar -czf "dist/$asset" -C "target/${{ matrix.target }}/release" herdr-alt-tab
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-alt-tab-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
